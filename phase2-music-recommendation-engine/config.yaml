# Phase 2: Music Recommendation Engine Configuration

server:
  host: "0.0.0.0"
  port: 8002
  workers: 1
  log_level: "info"

lastfm:
  enabled: true
  api_key: "${LASTFM_API_KEY}"
  timeout: 30
  max_retries: 3

review_engine:
  base_url: "${REVIEW_ENGINE_URL:http://localhost:8003}"
  timeout: 10
  max_retries: 3
  insights_enabled: true
  pain_point_threshold: 0.5
  auto_adjust_weights: true

database:
  url: "${DATABASE_URL:postgresql+asyncpg://user:password@localhost:5432/music_discovery}"
  pool_size: 10
  max_overflow: 20
  pool_timeout: 30

cache:
  host: "${REDIS_HOST:localhost}"
  port: 6379
  db: 0
  password: "${REDIS_PASSWORD:}"
  ttl:
    lastfm_data: 86400  # 24 hours
    review_insights: 21600  # 6 hours
    feature_vectors: 43200  # 12 hours

vector_store:
  persist_directory: "./data/chromadb"
  collection_name: "music_embeddings"
  embedding_model: "all-MiniLM-L6-v2"

recommendation:
  strategies:
    review_based:
      enabled: true
      weight: 0.3
      min_discovery_score: 0.5
      max_results: 10
    
    mood_activity:
      enabled: true
      weight: 0.25
      feature_tolerance: 0.1
      max_results: 10
    
    similarity_search:
      enabled: true
      weight: 0.2
      min_similarity: 0.7
      max_results: 10
    
    habit_breaking:
      enabled: true
      weight: 0.15
      novelty_threshold: 0.5
      max_results: 5
    
    genre_exploration:
      enabled: true
      weight: 0.1
      max_results: 5
  
  fusion:
    diversity_threshold: 0.7
    max_recommendations: 10
    min_recommendations: 3
    ranking_weights:
      strategy_score: 0.3
      novelty_score: 0.2
      diversity_score: 0.15
      intent_match_score: 0.15
      mood_match_score: 0.1
      activity_match_score: 0.05
      discovery_match_score: 0.03
      context_match_score: 0.02
    diversity_penalty: 0.1
    repetition_penalty: 0.5
    min_popularity: 10
    max_popularity: 95
  
  explanation:
    max_length: 200
    include_evidence: true
    template_style: "conversational"
    enabled: true
    storage_dir: "./data/explanations"
    max_explanations: 1000

api:
  cors_origins:
    - "http://localhost:3000"
    - "http://localhost:8001"
  rate_limit:
    requests_per_minute: 60
    burst: 10

logging:
  level: "INFO"
  format: "json"
  file: "./logs/recommendation_engine.log"
  rotation: "100 MB"
  retention: "30 days"

health_check:
  enabled: true
  endpoint: "/health"
  dependencies:
    - "lastfm"
    - "database"
    - "cache"
    - "vector_store"

metrics:
  enabled: true
  endpoint: "/metrics"
  collect_strategy_times: true
  collect_cache_stats: true
