name: Weekly Music Discovery Scheduler

on:
  schedule:
    # Run every Monday at 10:00 AM IST (4:30 AM UTC)
    - cron: '30 4 * * 1'
  workflow_dispatch:  # Allow manual triggering

jobs:
  weekly-scheduler:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install Phase 6 dependencies
        run: |
          cd phase6-scheduler
          pip install -r requirements.txt
      
      - name: Create logs directory
        run: |
          mkdir -p phase6-scheduler/logs/scheduler
      
      - name: Run weekly scheduler workflow
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          USE_MOCKS: false
          SCHEDULER_ENABLED: true
          SCHEDULER_TIMEZONE: Asia/Kolkata
          SCHEDULER_DAY_OF_WEEK: mon
          SCHEDULER_HOUR: 10
          SCHEDULER_MINUTE: 0
          LOG_DIR: ./logs/scheduler
          LOG_LEVEL: INFO
          LOG_FORMAT: json
        run: |
          cd phase6-scheduler
          python main.py manual
      
      - name: Upload scheduler logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scheduler-logs-${{ github.run_number }}
          path: phase6-scheduler/logs/scheduler/
          retention-days: 30
      
      - name: Create workflow summary
        if: always()
        run: |
          echo "## Weekly Scheduler Execution Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Execution Time:** $(date)" >> $GITHUB_STEP_SUMMARY
          echo "**Run Number:** ${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
          echo "**Trigger:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Workflow Steps" >> $GITHUB_STEP_SUMMARY
          echo "1. ✅ Repository checkout" >> $GITHUB_STEP_SUMMARY
          echo "2. ✅ Python environment setup" >> $GITHUB_STEP_SUMMARY
          echo "3. ✅ Dependencies installation" >> $GITHUB_STEP_SUMMARY
          echo "4. ✅ Weekly scheduler execution" >> $GITHUB_STEP_SUMMARY
          echo "5. ✅ Logs upload" >> $GITHUB_STEP_SUMMARY
