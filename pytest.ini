[pytest]
# Pytest Configuration for AI Music Discovery Companion

# Test Discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers
markers =
    phase1: Phase 1: AI Conversation Engine tests
    phase2: Phase 2: Music Recommendation Engine tests
    phase3: Phase 3: AI Orchestration tests
    phase4: Phase 4: Backend API tests
    phase5: Phase 5: Frontend UI tests
    api: API endpoint tests
    agent: Agent output tests
    pipeline: Pipeline execution tests
    integration: Integration tests
    slow: Slow-running tests
    unit: Unit tests

# Async Configuration
asyncio_mode = auto

# Output Options
addopts =
    -v
    --strict-markers
    --tb=short
    --cov=phase1-ai-conversation-engine
    --cov=phase2-music-recommendation-engine
    --cov=phase3-ai-orchestration
    --cov=phase4-backend-api
    --cov=phase5-frontend-ui
    --cov-report=term-missing
    --cov-report=html
    --cov-report=xml
    --html=reports/html/report.html
    --self-contained-html

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Coverage Options
[coverage:run]
source = .
omit =
    */tests/*
    */test_*.py
    */__pycache__/*
    */site-packages/*
    */virtualenv/*
    */venv/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
